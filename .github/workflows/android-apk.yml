name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, agent/unified-auth-finance-foundation]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keep a stable signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mali-android-signing-v2

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Mali-Android-v4-Preview.apk

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mali-Android-v4-Preview
          path: Mali-Android-v4-Preview.apk
          if-no-files-found: error

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v4.0.0-preview.1 >/dev/null 2>&1; then
            gh release upload android-v4.0.0-preview.1 Mali-Android-v4-Preview.apk --clobber
          else
            gh release create android-v4.0.0-preview.1 Mali-Android-v4-Preview.apk \
              --target "$GITHUB_SHA" \
              --title "مالي للجوال — الإصدار 4.0 التجريبي" \
              --notes "نسخة اختبارية منفصلة تُثبت بجانب النسخة القديمة، وتوحّد تسجيل الدخول بين الجوال والويب، وتدعم Google عبر المتصفح الآمن، وتحسّن العمليات المتكررة ووضوح الواجهة."
          fi
