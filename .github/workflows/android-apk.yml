name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "android-app-source-v3.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keep a stable signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mali-android-signing-v2

      - name: Extract Android source bundle
        run: unzip -q -o android-app-source-v3.zip

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Mali-Android-v3.apk

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mali-Android-v3
          path: Mali-Android-v3.apk
          if-no-files-found: error

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v3.0.0 >/dev/null 2>&1; then
            gh release upload android-v3.0.0 Mali-Android-v3.apk --clobber
          else
            gh release create android-v3.0.0 Mali-Android-v3.apk \
              --target "$GITHUB_SHA" \
              --title "مالي للجوال — الإصدار 3.0" \
              --notes "نسخة محسّنة تضيف حسابات اليوم و7 أيام و14 يومًا والشهر والشهرين و3 و6 أشهر والسنة، مع واجهة أوضح وإعدادات إشعار يومية أو أسبوعية أو كل أسبوعين أو شهرية. يعاد تفعيل التذكير بعد إعادة تشغيل الجوال أو تحديث التطبيق، مع زر اختبار وحالة واضحة لصلاحية الإشعارات."
          fi
