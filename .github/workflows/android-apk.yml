name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: mali-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify fully offline Android shell
        run: |
          if grep -R "vercel.app" android-app; then
            echo "Android must not depend on Vercel"
            exit 1
          fi
          grep -q 'file:///android_asset/index.html' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'evaluateAssetScript("enhancements.js")' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'evaluateAssetScript("ux-v82.js")' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'evaluateAssetScript("whole-riyal-editing.js")' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'partial-payments-v83.js' android-app/app/src/main/assets/whole-riyal-editing.js
          grep -q 'state.planPayments' android-app/app/src/main/assets/partial-payments-v83.js
          grep -q 'mali-offline-v8' android-app/app/src/main/assets/index.html
          python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('android-app/app/src/main/assets/index.html').read_text()
          match = re.search(r'<script>([\s\S]*?)</script>', text)
          if not match:
              raise SystemExit('Missing local app script')
          pathlib.Path('/tmp/mali-offline.js').write_text(match.group(1))
          PY
          node --check /tmp/mali-offline.js
          node --check android-app/app/src/main/assets/enhancements.js
          node --check android-app/app/src/main/assets/ux-v82.js
          node --check android-app/app/src/main/assets/whole-riyal-editing.js
          node --check android-app/app/src/main/assets/partial-payments-v83.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.MALI_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MALI_SIGNING_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "MALI_ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "Pull-request APK uses temporary validation signing and will never be published."
            exit 0
          fi

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Permanent release signing secrets are missing. Refusing to publish an APK that cannot update existing permanent-signed installs."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mali-release.p12"
          chmod 600 "$RUNNER_TEMP/mali-release.p12"
          echo "MALI_SIGNING_STORE_FILE=$RUNNER_TEMP/mali-release.p12" >> "$GITHUB_ENV"
          echo "MALI_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signing certificate continuity
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          echo "Built APK signer: $CERT"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            EXPECTED=$(tr -d '[:space:]' < android-app/signing-cert.sha256)
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "Signing certificate mismatch. Release blocked."
              exit 1
            fi
          fi

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/release/app-release.apk Mali-Android-v8.4.0.apk

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mali-Android-v8.4.0
          path: Mali-Android-v8.4.0.apk
          if-no-files-found: error

      - name: Publish direct-download release from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v8.4.0 >/dev/null 2>&1; then
            gh release upload android-v8.4.0 Mali-Android-v8.4.0.apk --clobber
          else
            gh release create android-v8.4.0 Mali-Android-v8.4.0.apk \
              --target "$GITHUB_SHA" \
              --title "مالي لأندرويد — الإصدار 8.4.0" \
              --notes "إصدار تأسيسي بتوقيع Android دائم ومحمي لمنع تكرار مشكلة التطبيق ليس مثبتًا في التحديثات القادمة. يحتفظ بجميع مزايا 8.3: الدفعات الجزئية للالتزامات، الريال الكامل، الحفظ المحلي، النسخ الاحتياطي والعمل Offline. بعد الانتقال مرة واحدة إلى هذا التوقيع، يجب أن تُثبت الإصدارات اللاحقة كتحديث مباشر فوق التطبيق مع بقاء البيانات."
          fi
