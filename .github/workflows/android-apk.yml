name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: mali-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native local-first Android architecture
        run: |
          if grep -R "vercel.app" android-app; then
            echo "Android must not depend on Vercel"
            exit 1
          fi
          grep -q 'android:name=".v9.MainActivity"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'class MainActivity : ComponentActivity' android-app/app/src/main/java/com/ha7n/mali/v9/MainActivity.kt
          grep -q 'Jetpack Compose' docs/v9-product-blueprint.md
          grep -q 'Room.databaseBuilder' android-app/app/src/main/java/com/ha7n/mali/v9/data/MaliDatabase.kt
          grep -q 'data class MonthlyPlanEntity' android-app/app/src/main/java/com/ha7n/mali/v9/data/MaliDatabase.kt
          grep -q 'KIND_TRANSFER' android-app/app/src/main/java/com/ha7n/mali/v9/data/MaliRepository.kt
          grep -q 'versionName = "9.0.0-alpha01"' android-app/app/build.gradle.kts
          if grep -R "WebView" android-app/app/src/main/java/com/ha7n/mali/v9; then
            echo "v9 native code must not use WebView"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.MALI_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MALI_SIGNING_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "MALI_ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "MALI_RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Pull-request APK uses temporary validation signing and will never be published."
            exit 0
          fi

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets are not configured. Release publication is blocked."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mali-release.p12"
          chmod 600 "$RUNNER_TEMP/mali-release.p12"
          echo "MALI_SIGNING_STORE_FILE=$RUNNER_TEMP/mali-release.p12" >> "$GITHUB_ENV"
          echo "MALI_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MALI_RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: android-app
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:testReleaseUnitTest 2>&1 | tee "$RUNNER_TEMP/v9-gradle-test.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "=== Mali v9 Gradle diagnostic ==="
              grep -E -i '(^e: |error:|FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|Cannot infer|Type mismatch|failed)' "$RUNNER_TEMP/v9-gradle-test.log" | tail -n 250 || true
            } > "$GITHUB_WORKSPACE/v9-gradle-diagnostic.txt"
            cat "$GITHUB_WORKSPACE/v9-gradle-diagnostic.txt"
          fi
          exit "$STATUS"

      - name: Upload Gradle diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v9-gradle-diagnostic
          path: v9-gradle-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Build signed installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signing certificate continuity
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          echo "Built APK signer: $CERT"

          if [ "$MALI_RELEASE_SIGNING_READY" = "true" ]; then
            EXPECTED=$(tr -d '[:space:]' < android-app/signing-cert.sha256)
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "Signing certificate mismatch. Release blocked."
              exit 1
            fi
          fi

      - name: Prepare release download file
        if: env.MALI_RELEASE_SIGNING_READY == 'true'
        run: cp android-app/app/build/outputs/apk/release/app-release.apk Mali-Android-v9.0.0.apk

      - name: Keep permanent-signed workflow artifact
        if: env.MALI_RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mali-Android-v9.0.0
          path: Mali-Android-v9.0.0.apk
          if-no-files-found: error

      - name: Publish direct-download release from main
        if: github.ref == 'refs/heads/main' && env.MALI_RELEASE_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v9.0.0 >/dev/null 2>&1; then
            gh release upload android-v9.0.0 Mali-Android-v9.0.0.apk --clobber
          else
            gh release create android-v9.0.0 Mali-Android-v9.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "مالي لأندرويد — الإصدار 9.0.0" \
              --notes "إعادة بناء أصلية لتطبيق مالي باستخدام Kotlin وJetpack Compose وRoom، مع تجربة استخدام أبسط وخطة شهرية مرتبطة بالمصروف الفعلي وتقارير أوضح وحفظ محلي وتوقيع Android دائم."
          fi
