name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main, agent/android-offline-v8]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: mali-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify fully offline Android shell
        run: |
          if grep -R "vercel.app" android-app; then
            echo "Android must not depend on Vercel"
            exit 1
          fi
          grep -q 'file:///android_asset/index.html' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'evaluateAssetScript("enhancements.js")' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'evaluateAssetScript("ux-v82.js")' android-app/app/src/main/java/com/ha7n/mali/MainActivity.java
          grep -q 'mali-offline-v8' android-app/app/src/main/assets/index.html
          python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('android-app/app/src/main/assets/index.html').read_text()
          match = re.search(r'<script>([\s\S]*?)</script>', text)
          if not match:
              raise SystemExit('Missing local app script')
          pathlib.Path('/tmp/mali-offline.js').write_text(match.group(1))
          PY
          node --check /tmp/mali-offline.js
          node --check android-app/app/src/main/assets/enhancements.js
          node --check android-app/app/src/main/assets/ux-v82.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keep a stable signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mali-android-signing-v2

      - name: Build signed installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/release/app-release.apk Mali-Android-v8.2.0.apk

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mali-Android-v8.2.0
          path: Mali-Android-v8.2.0.apk
          if-no-files-found: error

      - name: Publish direct-download release from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v8.2.0 >/dev/null 2>&1; then
            gh release upload android-v8.2.0 Mali-Android-v8.2.0.apk --clobber
          else
            gh release create android-v8.2.0 Mali-Android-v8.2.0.apk \
              --target "$GITHUB_SHA" \
              --title "مالي لأندرويد — الإصدار 8.2.0" \
              --notes "تحديث يركز على سهولة الاستخدام: كل المبالغ بالريال الكامل بدون هللات، تحسين تقسيم دخل المشاريع، بداية إرشادية واضحة، اختصارات أسرع، تصنيفات أغنى بالرموز، ألوان متناسقة، ملخصات ورسوم بصرية أوضح، مع الحفاظ على الحفظ المحلي والنسخ الاحتياطي والعمل Offline."
          fi
