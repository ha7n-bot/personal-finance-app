name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main, agent/production-v6-installments]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: mali-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keep a stable signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mali-android-signing-v2

      - name: Build signed installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/release/app-release.apk Mali-Android-v6.1.apk

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mali-Android-v6.1
          path: Mali-Android-v6.1.apk
          if-no-files-found: error

      - name: Publish direct-download release from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v6.1.0 >/dev/null 2>&1; then
            gh release upload android-v6.1.0 Mali-Android-v6.1.apk --clobber
          else
            gh release create android-v6.1.0 Mali-Android-v6.1.apk \
              --target "$GITHUB_SHA" \
              --title "مالي لأندرويد — الإصدار 6.1" \
              --notes "إصدار مالي 6.1 على النطاق الجديد: تسجيل Google والبريد، حفظ سحابي، عملية مرة واحدة، فاتورة شهرية مستمرة، أقساط محددة مع متابعة المتبقي، وخط عربي واضح، مع تنظيف ذاكرة WebView القديمة عند الترقية."
          fi
